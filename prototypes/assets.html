<html lang="en">

<style>
  :root { --pb-page-pad: 32px; }
  @media (max-width: 600px) { :root { --pb-page-pad: 16px; } }
  body { background: #fff; padding: var(--pb-page-pad); }

  /* page bits not in the design system (Figma "Assets & Banks" 972:4069) */
  .web .web-main { bottom: 0; overflow-y: auto; scrollbar-width: none; padding-bottom: var(--space-2xl); }
  .web .web-main::-webkit-scrollbar { display: none; }
  .a-lede { margin: 0; }
  .a-pop { position: relative; }   /* a select or a date field with its panel */
  .a-pop > .dropdown-panel { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; }
  .a-pop > .datepicker { position: absolute; left: 0; top: 100%; z-index: 20; }
  .a-pop .field--date, .a-pop .field--date .field__input { cursor: pointer; }
  .a-hub { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-lg); }
  .phone .a-hub { grid-template-columns: minmax(0, 1fr); gap: var(--space-md); }
  .a-hub .link-card__text, .link-card__text > * { margin: 0; }

  /* connect banks: web = a grid of cards, mobile = the DS bank list */
  .a-banks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-lg); }
  .a-banks .bank-option { border-radius: var(--radius-xl); box-shadow: none; min-height: 72px; }
  .a-banks .bank-option[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--color-border-green); }
  .a-connect { align-self: center; width: 336px; }

  /* connection: progress row + the provider's sign-in card */
  /* the BankID window over a dimmed page: our queue line on top, the provider's window under it */
  .a-bid-stack { width: min(396px, 100%); display: flex; flex-direction: column; gap: var(--space-md); }
  .a-bid-pill { border-radius: var(--radius-xl); background: var(--color-surface-secondary); box-shadow: none; }
  .a-bid-stack .a-provider { border-radius: var(--radius-xl); box-shadow: 0 24px 70px rgba(0, 0, 0, .35); }
  .a-flow__row { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) var(--space-lg); box-shadow: inset 0 -1px 0 var(--color-border-primary); }
  .a-flow__row .bank-card__info { flex: 1 1 auto; }
  .a-provider { display: flex; flex-direction: column; align-items: center; gap: var(--space-lg); padding: var(--space-xl) var(--space-xl) var(--space-2xl); background: var(--color-surface-info); text-align: center; min-height: 420px; justify-content: space-between; }
  .a-provider__logo { width: 88px; height: 88px; border-radius: 50%; overflow: hidden; background: var(--palette-neutral-0); }
  .a-provider__logo img { width: 100%; height: 100%; object-fit: cover; }
  .a-provider .qr { margin: 0 auto; }
  .a-provider .btn { width: auto; }
  /* the bank's own BankID window: its colours are the provider's, not Njorda's, in both themes */
  .a-provider { background: #f4f6fb; color: #1b1f2a; }
  .a-provider .tone-secondary { color: #3a4150; }
  .a-bid { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border: 0; border-radius: 26px; background: #2f6bfd; color: #fff; font: 600 15px/20px var(--font-family-base); cursor: pointer; }
  .a-bid svg { width: 22px; height: 22px; }
  .a-bid:hover { background: #255de0; }
  .a-bid[hidden] { display: none; }
  .a-provider { position: relative; }
  .a-bid-x { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: none; color: #9aa1ad; display: grid; place-items: center; cursor: pointer; }
  .a-bid-x svg { width: 20px; height: 20px; }
  .a-bid-x:hover { color: #1b1f2a; }
  .a-bid-wait { display: flex; flex-direction: column; align-items: center; gap: var(--space-md); margin: auto 0; }
  .a-bid-wait .spinner { color: #2f6bfd; }
  .a-center { min-height: 520px; display: flex; align-items: center; justify-content: center; }
  .phone .a-center { min-height: 480px; }

  /* banks tab */
  .a-bank-list { display: flex; flex-direction: column; gap: var(--space-lg); }
  .bank-card__head .badge { flex: 0 0 auto; }
  .a-bank-acts { display: flex; align-items: center; gap: var(--space-sm); flex: 0 0 auto; }
  .a-bank-acts .btn { width: auto; }
  .a-bank-acts .spinner { margin: 0 4px; }
  .bank-card .wtable { border-radius: 0 0 var(--radius-xl) var(--radius-xl); }
  .a-acc .wtable__row > span:first-child { flex: 1.3 1 0; }   /* accounts: name, number, type, value */

  /* forms */
  .a-form { display: flex; flex-direction: column; gap: var(--space-xl); }
  .a-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-lg) var(--space-lg); }
  .phone .a-grid { grid-template-columns: minmax(0, 1fr); }
  .a-grid .is-wide { grid-column: 1 / -1; }
  .field--area { height: 104px; align-items: flex-start; padding: 10px var(--space-lg); }
  .field--area textarea { height: 100%; resize: none; }
  .web .a-save { align-self: center; width: 336px; }
  .a-tabs { display: flex; gap: var(--space-md); }
  .a-search { position: relative; }
  .a-search .dropdown-panel { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; }
  /* several listed securities at once: one row each, only the quantity is typed (and the value, when there is no market price) */
  .a-sec { display: flex; flex-direction: column; }
  .a-warn { color: var(--color-fg-warning); }
  .a-secs .wtable__row { min-height: 64px; }
  .a-secs .wtable__row > span:first-child { flex: 1.6 1 0; }
  .a-secs .a-q { flex: 0 0 120px; }
  .a-secs .a-x { flex: 0 0 32px; display: flex; justify-content: flex-end; }
  .a-secs .num .field { width: 150px; margin-left: auto; }
  .a-q .field, .a-secs .num .field, .a-secrow .field { height: 40px; }
  .a-q, .a-secrow__tot { min-width: 0; }
  .a-q .field__input, .a-secrow__tot .field__input { width: 100%; min-width: 0; }
  .a-seclist { display: flex; flex-direction: column; gap: var(--space-md); }
  .a-secrow { display: flex; flex-direction: column; gap: var(--space-md); padding: var(--space-md) var(--space-lg); border-radius: var(--radius-xl); background: var(--color-surface-secondary); }
  .a-secrow__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-md); }
  .a-secrow__calc { display: flex; align-items: center; gap: var(--space-sm); }
  .a-secrow__calc .a-q { flex: 0 0 88px; }
  .a-secrow__tot { margin-left: auto; text-align: right; }
  .a-secrow__tot .field { width: 128px; }
  .field--warn { background: var(--color-surface-warning); border-color: transparent; }
  .field--warn .field__input { color: var(--color-fg-warning); }
  .back-btn { width: 24px; height: 24px; padding: 0; border: 0; background: transparent; color: var(--color-fg-primary); }
  .back-btn svg { width: 24px; height: 24px; }
  .wtable__row.is-new, .table-row.is-new { background: var(--color-surface-ai-highlight); }
  .wtable .num { white-space: nowrap; }

  /* the first time through, right after sign-up: the same screens as in the app, without its navigation */
  .fr-web { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--color-surface-primary); font-family: var(--font-family-base); color: var(--color-fg-primary); }
  .fr-web__main { flex: 1 1 auto; overflow-y: auto; scrollbar-width: none; padding: var(--space-3xl) var(--space-2xl); }
  .fr-web__main::-webkit-scrollbar { display: none; }
  .fr-col { width: min(800px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-xl); }
  .fr-head { display: flex; flex-direction: column; gap: var(--space-sm); }
  .fr-head > * { margin: 0; }
  .fr-skip { text-decoration: none; }
  .fr-title { display: flex; align-items: center; justify-content: space-between; gap: var(--space-lg); }
  .fr-title > * { margin: 0; }
  /* review: what has been added so far (pattern from the Holdings Collection redesign) */
  .rv { display: flex; flex-direction: column; gap: var(--space-xl); }
  .rv-sec { display: flex; flex-direction: column; gap: var(--space-md); }
  .rv-sec > p { margin: 0; }
  .rv-ico { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; display: grid; place-items: center; background: var(--color-surface-primary); color: var(--color-fg-primary); }
  .rv-ico svg { width: 20px; height: 20px; }
  .rv-add { display: flex; align-items: center; gap: var(--space-sm); width: 100%; padding: 14px var(--space-lg); border: 1.5px dashed var(--color-border-secondary); border-radius: var(--radius-xl); background: transparent; color: var(--color-fg-primary); font: inherit; cursor: pointer; text-align: left; }
  .rv-add svg { width: 20px; height: 20px; }
  .rv-add:hover { border-color: var(--color-fg-primary); }
  .fr-web .a-save, .fr-web .a-connect { align-self: center; width: 336px; }
  .rv-empty { margin: 0; }
  .fr-col .web-head { margin-bottom: 0; }
  .phone .page-header.fr-bar { justify-content: space-between; }
  .phone .fr-col { gap: var(--space-lg); }

  /* the empty app: Overview says what will show up, the action sits under it (web) or in the dock (phone) */
</style>
</head>
<body>
<div id="block"></div>

<script src="ds/icons.js"></script>
<script src="ds/badge-icons.js"></script>
<script src="shared/data.js"></script>
<script src="shared/app-shell.js"></script>
<script src="shared/ai-chat.js"></script>
<script src="shared/typo.js"></script>
<script src="shared/block.js"></script>
<script>
(function () {
  var A = App, I = A.icon, esc = A.esc, kr = A.kr, D = A.D, B = window.BADGE_ICONS;
  function price(x) { return x.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' kr'; }
  function logo(id, name) {
    return id ? '<span class="bank-card__logo"><img src="ds/assets/images/banks/' + id + '.svg" alt=""></span>'
      : '<span class="bank-card__logo" style="display:grid;place-items:center" aria-hidden="true"><span class="type-label">' + esc(name[0]) + '</span></span>';
  }

  var BANKS = [['avanza', 'Avanza'], ['carnegie', 'Carnegie'], ['danske-bank', 'Danske Bank'], ['garantum', 'Garantum'], ['handelsbanken', 'Handelsbanken'], ['lansforsakringar', 'Länsförsäkringar'],
    ['levler', 'Levler'], ['movestic', 'Movestic'], ['nordea', 'Nordea'], ['nordnet', 'Nordnet'], ['revolut', 'Revolut'], ['savr', 'Savr'], ['sbab', 'SBAB'], ['seb', 'SEB'],
    ['skandia', 'Skandia'], ['sparbanken-syd', 'Sparbanken Syd'], ['swedbank', 'Swedbank']];
  /* what a newly connected bank brings in: its accounts (name, type, value) */
  var NEW_ACCOUNTS = {
    avanza: [['ISK', 'ISK', 256100], ['Sparkonto', 'Savings', 43500]],
    handelsbanken: [['Allkonto', 'Savings', 24300], ['Depå', 'Investment', 198200]],
    nordea: [['Sparkonto Plus', 'Savings', 12900], ['ISK', 'ISK', 184300], ['Fondkonto', 'Fund account', 62000]],
    nordnet: [['ISK Sparande', 'ISK', 317610], ['Kapitalförsäkring', 'KF', 88400]],
    seb: [['Sparkonto', 'Savings', 85000], ['Fondkonto', 'Fund account', 47300]],
    swedbank: [['e-sparkonto', 'Savings', 18750], ['ISK', 'ISK', 55000]],
    sbab: [['Sparkonto', 'Savings', 40000]], lansforsakringar: [['Fondkonto', 'Fund account', 31200]], skandia: [['Tjänstepension', 'Pension', 152400]],
    'danske-bank': [['Opsparing', 'Savings', 9800]], revolut: [['Savings Vault', 'Savings', 6400]], carnegie: [['Depå', 'Investment', 58700]],
    movestic: [['Pensionsförsäkring', 'Pension', 88300]], savr: [['ISK', 'ISK', 21500]], 'sparbanken-syd': [['Sparkonto', 'Savings', 15600]]
  };

  var TYPES = [
    ['connect', 'connect', 'Connect banks', 'Automatically import from your bank'], ['stocks', 'chart', 'Stocks & Funds', 'Add listed securities manually'],
    ['cash', 'wallet', 'Cash & Savings', 'Manual bank accounts and savings'], ['pe', 'pie-chart', 'Private Equity & Startups', 'Private company investments'],
    ['realestate', 'real-estate', 'Real Estate', 'Homes, holiday homes and land'], ['crypto', 'crypto', 'Cryptocurrency', 'Digital assets and tokens'],
    ['vehicle', 'vehicle', 'Vehicles', 'Cars, boats and other'], ['metals', 'metals', 'Precious Metals', 'Gold, silver and other metals'],
    ['collectibles', 'collectibles', 'Collectibles & Valuables', 'Art, wine, watches, jewellery'], ['liability', 'liabilities', 'Liabilities', 'Debts, loans and mortgages'],
    ['other', 'box', 'Other (Value)', 'Any asset with total value'], ['otherqty', 'box', 'Other (Quantity & Price)', 'Any asset with quantity and price']
  ];
  var TYPE_NAME = { cash: 'Cash', pe: 'Private equity', realestate: 'Real estate', crypto: 'Crypto', vehicle: 'Vehicle', metals: 'Precious metals', collectibles: 'Collectible', liability: 'Liability', other: 'Other', otherqty: 'Other', stocks: 'Stock' };
  var SECURITIES = [
    { n: 'Volvo AB ser. B', tk: 'VOLV B', isin: 'SE0000115446', p: 268.40 }, { n: 'Ericsson ser. B', tk: 'ERIC B', isin: 'SE0000108656', p: 81.32 },
    { n: 'Apple Inc.', tk: 'AAPL', isin: 'US0378331005', p: 2293.05 }, { n: 'Microsoft Corp.', tk: 'MSFT', isin: 'US5949181045', p: 4265.00 },
    { n: 'Investor AB ser. B', tk: 'INVE B', isin: 'SE0015811963', p: 302.25 }, { n: 'Atlas Copco A', tk: 'ATCO A', isin: 'SE0017486889', p: 169.23 },
    { n: 'Flat Capital AB ser. B', tk: 'FLAT B', isin: 'SE0018370546', p: null }, { n: 'Tesla Inc.', tk: 'TSLA', isin: 'US88160R1014', p: 4120.80 }
  ];

  /* kept across the tabs of the first time through: what has been added, and the message to show on arrival */
  var added = [], pending = null;
  var SAMPLE = [
    { kind: 'bank', id: 'nordea', name: 'Nordea', open: true, accounts: [['Sparkonto Plus', '3300 48 210 77', 'Savings', 12900], ['ISK', '3300 51 774 02', 'ISK', 184300], ['Fondkonto', '3300 60 118 45', 'Fund account', 62000]] },
    { kind: 'bank', id: 'avanza', name: 'Avanza', accounts: [['ISK', '9552 11 804 33', 'ISK', 256100], ['Sparkonto', '9552 20 551 90', 'Savings', 43500]] },
    { kind: 'manual', type: 'realestate', n: 'Cottage in Dalarna', sub: 'Sälenvägen 12, Malung', v: 1250000 }
  ];

  Block({
    el: document.getElementById('block'),
    eyebrow: 'Njorda app',
    title: 'Everything you own, in one place',
    intro: 'After signing up, people add what they own: banks in one go with BankID, everything else by hand. The step can be skipped and finished later in the app.',
    states: [
      { id: 'start', label: 'Add what you own', note: 'Connecting banks is the quickest way to fill the app, so it comes first. Anything else can be added manually.' },
      { id: 'connect', label: 'Connect banks', note: 'Pick several banks, confirm each with BankID. Read-only: Njorda never moves money.' },
      { id: 'manual', label: 'Add manually', note: 'Real estate as an example. Basic is enough to save; Details and Advanced are optional.' },
      { id: 'review', label: 'Review', note: 'Everything added so far, banks first. Add more goes back for another round.' }
    ],
    render: render
  });

  function render(ctx) {
    App.chatSide(ctx, 'assets');   // Njorda AI in the side menu (web) or the More menu (phone) opens the chat
    var web = ctx.mode === 'web';
    var full = ctx.state === 'connect' && /(^|&)view=banks(&|$)/.test(location.hash.slice(1));   // the Banks page on its own, for the store image (drafts/brand-shot.html)
    var firstRun = !full;                                 // right after sign-up: no app navigation, nothing connected yet
    var s = {
      view: full ? 'banks' : { start: 'start', connect: 'pick', manual: 'form', review: 'review' }[ctx.state],
      selected: [],
      banks: !full ? [] : [
        { id: 'nordnet', name: 'Nordnet', status: 'ok', open: true, accounts: [['ISK Sparande', '9960 12 345 67', 'ISK', 317610]] },
        { id: 'avanza', name: 'Avanza', status: 'off', open: false, accounts: [['Kapitalförsäkring', '9552 00 487 12', 'KF', 247086]] },
        { id: 'seb', name: 'SEB', status: 'ok', open: false, accounts: [['Sparkonto', '5357 10 042 88', 'Savings', 85000], ['Mortgage', '5357 80 113 04', 'Mortgage', -2180000]] }
      ],
      more: false, secs: [], manual: [], type: 'realestate', tab: 'basic', form: {}, err: {}, pop: null, cal: null,
      sec: null, q: '', menu: null, flow: null, newRow: null
    };
    var timers = [];
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function bank(id) { return s.banks.filter(function (b) { return b.id === id; })[0]; }

    /* ---------- views ---------- */
    function hubView() {
      return '<p class="a-lede type-body-lg tone-secondary">Select the type of asset you’d like to track</p>' + hubCards();
    }
    function hubCards() {
      return '<div class="a-hub">' + TYPES.map(function (t) {
        return '<button type="button" class="link-card" data-type="' + t[0] + '"><span class="link-card__icon">' + I(t[1]) + '</span><span class="link-card__text"><span class="type-body-strong">' + t[2] + '</span><span class="type-body tone-secondary">' + t[3] + '</span></span><span class="link-card__arrow">' + I('arrow-right') + '</span></button>';
      }).join('') + '</div>';
    }
    function startView() {
      var more = s.more;   // opened from Review with Add more: a way back to it; the tab itself always shows the first step
      var skip = web && !more ? '<button type="button" class="link fr-skip type-body-strong" data-a="skip">Skip for now</button>' : '';   // on a phone it sits in the header
      return '<div class="fr-col"><div class="fr-head">' + (more && web ? '<div class="web-head"><button type="button" class="back-btn" data-a="toreview" aria-label="Back to review">' + I('back') + '</button><h1 class="web-head__title type-page-title">Add more</h1></div>' : '<div class="fr-title"><h1 class="type-page-title">' + (more ? 'Add more' : 'Let’s add what you own') + '</h1>' + skip + '</div>') +
        '<p class="type-body-lg tone-secondary">Connect your banks or add assets manually to see the whole picture.</p></div>' + hubCards() + '</div>';
    }
    /* Review: banks with their accounts, then what was added manually, then a way back to the options */
    function accRows(list) {
      return web
        ? '<div class="wtable a-acc"><div class="wtable__row wtable__row--head type-body"><span>Name</span><span>Account number</span><span>Type</span><span class="num">Value</span></div>' + list.map(function (a) {
            return '<div class="wtable__row type-body"><span>' + esc(a[0]) + '</span><span class="tone-secondary">' + esc(a[1]) + '</span><span>' + esc(a[2]) + '</span><span class="num type-value">' + kr(a[3]) + '</span></div>';
          }).join('') + '</div>'
        : list.map(function (a) { return '<div class="table-row"><div class="table-row__main"><span class="type-body">' + esc(a[0]) + '</span><span class="type-caption tone-secondary">' + esc(a[1] + ', ' + a[2]) + '</span></div><span class="table-row__value type-value">' + kr(a[3]) + '</span></div>'; }).join('');
    }
    function reviewView() {
      var banks = added.filter(function (a) { return a.kind === 'bank'; }), hand = added.filter(function (a) { return a.kind === 'manual'; });
      var del = function (a) { return '<button type="button" class="icon-action" data-rdel="' + added.indexOf(a) + '" aria-label="Remove ' + esc(a.name || a.n) + '">' + I('close') + '</button>'; };
      var bankHtml = banks.map(function (b) {
        var n = b.accounts.length;
        return '<div class="bank-card" aria-expanded="' + !!b.open + '"><div class="bank-card__head"><button type="button" class="bank-card__toggle" data-rtog="' + added.indexOf(b) + '" aria-label="Show accounts">' + I('arrow-right') + '</button>' +
          logo(b.id, b.name) + '<span class="bank-card__info"><span class="type-value">' + esc(b.name) + '</span><span class="type-caption tone-secondary">' + n + (n === 1 ? ' account' : ' accounts') + '</span></span>' + del(b) + '</div>' +
          '<div class="bank-card__accounts">' + accRows(b.accounts) + '</div></div>';
      }).join('');
      /* what was added manually is grouped by kind of asset, in the order of the options */
      var handHtml = TYPES.filter(function (t) { return hand.some(function (a) { return a.type === t[0]; }); }).map(function (t) {
        return '<div class="rv-sec"><p class="type-body-strong tone-secondary">' + esc(t[2]) + '</p><div class="a-bank-list">' + hand.filter(function (a) { return a.type === t[0]; }).map(function (a) {
          return '<div class="bank-card"><div class="bank-card__head"><span class="rv-ico">' + I(t[1]) + '</span>' +
            '<span class="bank-card__info"><span class="type-value">' + esc(a.n) + '</span><span class="type-caption tone-secondary">' + esc((a.sub ? a.sub + ', ' : '') + kr(a.v)) + '</span></span>' + del(a) + '</div></div>';
        }).join('') + '</div></div>';
      }).join('');
      return '<div class="rv">' +
        (banks.length ? '<div class="rv-sec"><p class="type-body-strong tone-secondary">Connected banks</p><div class="a-bank-list">' + bankHtml + '</div></div>' : '') +
        handHtml +

          : s.view === 'form' || s.view === 'stocks' ? A.tabbar(null, '<div class="tabbar__action"><button type="button" class="btn btn--primary" data-a="save">' + (s.view === 'stocks' ? stockLabel() : 'Save asset') + '</button></div>')
          : s.view === 'flow' ? A.tabbar(null, '')
          : A.tabbar(s.view === 'assets' ? 'assets' : 'more', action ? '<div class="tabbar__action">' + action.replace('btn--h40 ', '').replace(' btn--auto', '') + '</div>' : '');
        ctx.screen.innerHTML = '<div class="phone">' + A.statusbar() + '<header class="page-header">' + (root ? '' : '<button type="button" class="page-header__back" data-back aria-label="Back">' + I('back') + '</button>') +
          '<h1 class="page-header__title type-page-title">' + title() + '</h1></header><main class="screen-content">' + V + '</main></div>' + dock;
        // room at the bottom for exactly what sits there (a button, the tab bar, or both), plus a gap
        var tb = ctx.screen.querySelector('.tabbar'), mn = ctx.screen.querySelector('.screen-content');
        if (tb && mn) mn.style.paddingBottom = (tb.offsetHeight + 24) + 'px';
      }
      var sc2 = ctx.screen.querySelector(web ? '.web-main, .fr-web__main' : '.phone'); if (sc2) sc2.scrollTop = top;
      bind();
    }
    function go(v) { s.view = v; s.err = {}; s.menu = null; draw(); var sc = ctx.screen.querySelector(web ? '.web-main, .fr-web__main' : '.phone'); if (sc) sc.scrollTop = 0; }

    function bind() {
      var root = ctx.screen;
      function on(sel, fn) { root.querySelectorAll(sel).forEach(function (b) { b.onclick = function (e) { e.preventDefault(); e.stopPropagation(); fn(b); }; }); }
      on('[data-type]', function (b) {
        var t = b.getAttribute('data-type');
        if (s.view === 'start' && t === 'connect') { ctx.go('connect'); return; }   // the first step: banks open their own tab, the rest opens in place
        if (t === 'connect') { s.selected = []; go('pick'); }
        else if (t === 'stocks') { s.secs = []; s.q = ''; s.err = {}; go('stocks'); }
        else { s.type = t; s.tab = 'basic'; s.form = {}; go('form'); }
      });
      on('[data-go]', function (b) { go(b.getAttribute('data-go')); });
      on('[data-a="skip"]', function () { ctx.note('Skip for now opens the app with nothing in it yet; everything here can be added later from Add assets.'); });
      on('[data-a="more"]', function () { s.more = true; go('start'); });
      on('[data-a="toreview"]', function () { ctx.go('review'); });
      on('[data-rtog]', function (b) { var x = added[+b.getAttribute('data-rtog')]; x.open = !x.open; draw(); });
      on('[data-rdel]', function (b) {
        var x = added[+b.getAttribute('data-rdel')], name = x.name || x.n;
        A.confirmModal(ctx.screen, 'Remove ' + name + '?', x.kind === 'bank' ? 'Its accounts won’t be added to Njorda. You can connect it again later.' : 'It won’t be added to Njorda. You can add it again later.', 'Remove', function () {
          added.splice(added.indexOf(x), 1); draw(); A.confirmPill(ctx.screen, name + ' removed', web ? 40 : 200);
        });
      });
      on('[data-a="continue"]', function () { ctx.note('Continue opens the app with what was added: Overview, risk and goals start from these numbers.'); });
      on('[data-act="add"]', function () { go('hub'); });
      on('[data-back]', function () { if (s.flow) timers.forEach(clearTimeout); s.flow = null; if (firstRun) { if (s.view === 'pick' || s.view === 'flow') ctx.go(added.length ? 'review' : 'start'); else if (ctx.state === 'start') go('start'); else ctx.go('start'); return; } go(s.view === 'hub' ? 'assets' : s.view === 'pick' || s.view === 'flow' ? (s.from || 'hub') : 'hub'); });
      on('[data-bank]', function (b) { var id = b.getAttribute('data-bank'), k = s.selected.indexOf(id); if (k > -1) s.selected.splice(k, 1); else s.selected.push(id); draw(); });
      on('[data-a="connect"]', function () { if (s.selected.length) startFlow(s.selected.slice(), false); });
      on('[data-a="bankid"]', function () { s.flow.qr = true; draw(); later(nextBank, 1500); });
      on('[data-a="bidclose"]', skipBank);
      on('[data-toggle]', function (b) { var x = s.banks[+b.getAttribute('data-toggle')]; x.open = !x.open; draw(); });
      on('[data-menu]', function (b) { var i = +b.getAttribute('data-menu'); s.menu = s.menu === i ? null : i; draw(); });
      on('[data-refresh]', function (b) { var x = s.banks[+b.getAttribute('data-refresh')]; s.menu = null; x.status = 'busy'; draw(); later(function () { x.status = 'ok'; draw(); A.confirmPill(ctx.screen, x.name + ' updated', web ? 40 : 200); }, 1400); });
      on('[data-reconnect]', function (b) { var x = s.banks[+b.getAttribute('data-reconnect')]; s.from = 'banks'; startFlow([x.id], true); });
      on('[data-detach]', function (b) {
        var i = +b.getAttribute('data-detach'), x = s.banks[i]; s.menu = null; draw();
        A.confirmModal(ctx.screen, 'Disconnect ' + x.name + '?', 'Its accounts and holdings will be removed from Njorda. Your account at ' + x.name + ' is not affected.', 'Disconnect', function () {
          s.banks.splice(i, 1); draw(); A.confirmPill(ctx.screen, x.name + ' disconnected', web ? 40 : 200);
        });
      });
      on('[data-ftab]', function (b) { keep(); s.tab = b.getAttribute('data-ftab'); draw(); });
      on('[data-pop]', function (b) { keep(); var id = b.getAttribute('data-pop'); s.pop = s.pop === id ? null : id; s.cal = null; draw(); });
      on('[data-pick]', function (b) { s.form[b.getAttribute('data-pick')] = b.getAttribute('data-val'); s.pop = null; draw(); });
      on('[data-day]', function (b) { s.form[b.getAttribute('data-day')] = b.getAttribute('data-val'); s.pop = null; s.cal = null; draw(); });
      on('[data-month]', function (b) {
        var id = s.pop, sel = parseDate(s.form[id] != null ? s.form[id] : (id === 'date' ? '02.02.2026' : '')), v = s.cal || (sel ? [sel[0], sel[1]] : [TODAY[0], TODAY[1]]);
        var d = new Date(v[0], v[1] + (+b.getAttribute('data-month')), 1); s.cal = [d.getFullYear(), d.getMonth()]; draw();
      });
      root.onclick = function (e) { if (s.pop && !(e.target.closest && e.target.closest('.a-pop'))) { keep(); s.pop = null; s.cal = null; draw(); } };   // a click elsewhere closes the open list or calendar
      on('[data-sec]', function (b) {
        s.secs.push({ sec: SECURITIES[+b.getAttribute('data-sec')], qty: '', value: '' }); s.q = ''; draw();
        var n = ctx.screen.querySelector('[data-qty="' + (s.secs.length - 1) + '"]'); if (n) n.focus();   // straight on to the quantity
      });
      on('[data-unsec]', function (b) { s.secs.splice(+b.getAttribute('data-unsec'), 1); s.err = {}; draw(); });
      on('[data-a="save"]', save);
      var form = root.querySelector('[data-form]'); if (form) form.onsubmit = function (e) { e.preventDefault(); save(); };
      root.querySelectorAll('.field__input').forEach(function (f) {
        f.oninput = function () {
          if (f.id === 'f-q') { s.q = f.value; var pos = f.selectionStart; draw(); var n = ctx.screen.querySelector('#f-q'); n.focus(); n.setSelectionRange(pos, pos); return; }
          keep(); var w = f.closest('.field'); w.classList.remove('field--error');
          if (f.id === 'f-name' || f.id === 'f-value') { var pos2 = f.selectionStart, id = f.id; draw(); var n2 = ctx.screen.querySelector('#' + id); if (n2) { n2.focus(); n2.setSelectionRange(pos2, pos2); } }
        };
      });
      bindSecs();   // after the generic field handlers, so these win
    }
    function bindSecs() {
      ctx.screen.querySelectorAll('[data-qty], [data-val]').forEach(function (f) {
        f.oninput = function () {
          var q = f.hasAttribute('data-qty'), i = +f.getAttribute(q ? 'data-qty' : 'data-val'), r = s.secs[i];
          r[q ? 'qty' : 'value'] = f.value; f.closest('.field').classList.remove('field--error');
          var t = ctx.screen.querySelector('[data-total="' + i + '"]'); if (t) t.textContent = price(num(r.qty) * r.sec.p);
        };
      });
    }
    function keep() { ctx.screen.querySelectorAll('.field__input').forEach(function (f) { if (f.id && f.id !== 'f-q' && !f.readOnly) s.form[f.id.slice(2)] = f.value; }); }

    /* ---------- connecting ---------- */
    function startFlow(ids, reconnect) {
      s.flow = { ids: ids, i: 0, qr: false, reconnect: reconnect, step: 'bank' };
      go('flow');
      later(autoConfirm, 2600);
    }
    function autoConfirm() { if (s.flow && s.flow.step === 'bank' && !s.flow.qr) { s.flow.qr = true; draw(); later(nextBank, 1500); } }
    function nextBank() {
      var f = s.flow; if (!f) return;
      if (f.i < f.ids.length - 1) { f.i++; f.qr = false; draw(); later(autoConfirm, 2600); return; }
      finish();
    }
    function skipBank() {
      var f = s.flow; if (!f || f.step !== 'bank') return;
      timers.forEach(clearTimeout); timers = [];
      f.skip = (f.skip || []).concat(f.ids[f.i]);
      nextBank();
    }
    function finish() {
      var f = s.flow;
      f.ids = f.ids.filter(function (id) { return !f.skip || f.skip.indexOf(id) < 0; });
      if (!f.ids.length) { s.flow = null; go(f.reconnect ? 'banks' : 'pick'); return; }   // every window was closed: back to the banks, still picked
      f.step = 'collect'; draw();
      later(function () {
        f.ids.forEach(function (id) {
          var x = bank(id);
          if (x) { x.status = 'ok'; x.open = true; }
          else { var list = NEW_ACCOUNTS[id] || [['Sparkonto', 'Savings', 10000]], name = BANKS.filter(function (b) { return b[0] === id; })[0][1]; s.banks.push({ id: id, name: name, status: 'ok', open: true, accounts: list.map(function (x, k) { return [x[0], '•••• ' + (1000 + (id.length + k) * 397 % 9000), x[1], x[2]]; }) }); }
        });
        if (firstRun) {
          f.ids.forEach(function (id) { var x = bank(id), had = added.filter(function (a) { return a.id === id; })[0]; if (had) had.accounts = x.accounts; else added.push({ kind: 'bank', id: id, name: x.name, accounts: x.accounts }); });
          pending = f.ids.length + (f.ids.length > 1 ? ' banks connected' : ' bank connected'); s.flow = null; ctx.go('review'); return;
        }
        s.newRow = f.ids.length === 1 && f.reconnect ? null : f.ids[f.ids.length - 1];
        var msg = f.reconnect ? bank(f.ids[0]).name + ' reconnected' : f.ids.length + (f.ids.length > 1 ? ' banks connected' : ' bank connected');
        s.flow = null; s.from = null; go('banks'); A.confirmPill(ctx.screen, msg, web ? 40 : 200);
        ctx.note(f.reconnect ? 'Reconnected: the badge turns green and the accounts load again, without leaving the page.' : 'Connected: the new accounts appear straight away, expanded, so you can check them.');
      }, 1800);
    }

    /* ---------- saving ---------- */
    function num(x) { return parseFloat(String(x || '').replace(/\s/g, '').replace(',', '.')) || 0; }
    function save() {
      keep();
      if (s.view === 'form') {
        s.err = {};
        if (!s.form.name) s.err.name = 'Give the asset a name';
        if (!num(s.form.value)) s.err.value = s.type === 'liability' ? 'Enter the amount' : 'Enter the value';
        if (Object.keys(s.err).length) { s.tab = 'basic'; draw(); return; }
        var v = num(s.form.value) * (s.type === 'liability' ? -1 : 1);
        if (firstRun) { added.push({ kind: 'manual', type: s.type, n: s.form.name, sub: s.type === 'realestate' ? (s.form.address || '') : s.type === 'liability' ? (s.form.lender || '') : '', v: v }); pending = s.form.name + ' added'; ctx.go('review'); return; }
        s.manual.push({ n: s.form.name, t: TYPE_NAME[s.type], v: v });
        go('assets'); A.confirmPill(ctx.screen, s.form.name + ' added', web ? 40 : 200);
        ctx.note('Saved with only the basics. The new asset is highlighted in the list and counts in every total straight away.');
      } else if (s.view === 'stocks') {
        s.err = {};
        s.secs.forEach(function (r, i) { if (!num(r.qty)) s.err['row' + i] = 'qty'; else if (r.sec.p == null && !num(r.value)) s.err['row' + i] = 'value'; });
        if (!s.secs.length || Object.keys(s.err).length) { draw(); return; }
        var list = s.secs.map(function (r) { return { n: r.sec.n, tk: r.sec.tk + ', ' + r.qty + (num(r.qty) === 1 ? ' share' : ' shares'), v: Math.round(r.sec.p == null ? num(r.value) : num(r.qty) * r.sec.p) }; });
        var msg = list.length > 1 ? list.length + ' assets added' : list[0].n + ' added';
        if (firstRun) { list.forEach(function (a) { added.push({ kind: 'manual', type: 'stocks', n: a.n, sub: a.tk, v: a.v }); }); pending = msg; ctx.go('review'); return; }
        list.forEach(function (a) { s.manual.push({ n: a.n, t: 'Stock', v: a.v }); });
        go('assets'); A.confirmPill(ctx.screen, msg, web ? 40 : 200);
      }
    }

    /* typed example, so the form can be watched without typing */
    function typeInto(id, text, done) {
      var el = ctx.screen.querySelector('#f-' + id), i = 0;
      var t = setInterval(function () {
        if (!el || !el.isConnected) return clearInterval(t);
        el.value = text.slice(0, ++i);
        if (i >= text.length) { clearInterval(t); el.dispatchEvent(new Event('input')); if (done) later(done, 250); }
      }, 32);
      timers.push(t);
    }

    /* ---------- start ---------- */
    if (ctx.state === 'review' && !added.length) added = SAMPLE.map(function (a) { return Object.assign({}, a); });
    draw();
    if (ctx.state === 'manual') typeInto('name', 'Cottage in Dalarna', function () { typeInto('address', 'Sälenvägen 12, Malung', function () { typeInto('value', '1 250 000'); }); });
    if (ctx.state === 'review' && pending) { A.confirmPill(ctx.screen, pending, web ? 40 : 200); pending = null; }
  }
})();
</script>
</body>
</html>
